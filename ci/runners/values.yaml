# Runner scale set for SplittingAtom/kobe (Actions Runner Controller, gha-runner-scale-set chart).
# Workflows select it with `runs-on: ${{ vars.KOBE_RUNNER || 'ubuntu-latest' }}` and the repository
# variable KOBE_RUNNER=kobe-k3s. See ci/runners/README.md.
githubConfigUrl: https://github.com/SplittingAtom/kobe
githubConfigSecret: kobe-arc-github-app

runnerScaleSetName: kobe-k3s
minRunners: 0
maxRunners: 6

# Docker-in-Docker, written out instead of `containerMode: dind` so Docker's data and the job
# workspace live on per-runner Longhorn scratch volumes rather than the nodes' small root disks.
template:
  spec:
    terminationGracePeriodSeconds: 60
    # Jobs never get a credential for the host cluster (kubectl in a job would otherwise pick up
    # this pod's service account and namespace).
    automountServiceAccountToken: false
    # Fresh Longhorn volumes are root-owned; the runner runs as uid 1001 in group docker (123).
    securityContext:
      fsGroup: 123
      fsGroupChangePolicy: OnRootMismatch
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            actions.github.com/scale-set-name: kobe-k3s
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:29-dind
        restartPolicy: Always # native sidecar: starts before the runner, stops after it
        # The image's own entrypoint and process chain (docker-init as PID 1 forwarding SIGTERM to
        # dockerd), plus a copy of the daemon log on the shared work volume so a failing job can
        # print it (scripts/ci-docker-diagnostics.sh). tee ignores SIGTERM and ends at EOF.
        command: ["sh", "-c"]
        args:
          - >-
            mkdir -p /home/runner/_work/_dind && rm -f /tmp/dockerd-log.fifo &&
            mkfifo /tmp/dockerd-log.fifo &&
            { (trap "" TERM INT; exec tee -a /home/runner/_work/_dind/dockerd.log) </tmp/dockerd-log.fifo & } &&
            exec dockerd-entrypoint.sh dockerd --host=unix:///var/run/docker.sock
            --group=$(DOCKER_GROUP_GID) >/tmp/dockerd-log.fifo 2>&1
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command: ["docker", "info"]
          periodSeconds: 5
          failureThreshold: 24
        resources:
          requests: { cpu: 1500m, memory: 4Gi }
          limits: { cpu: "6", memory: 10Gi }
        volumeMounts:
          - { name: work, mountPath: /home/runner/_work }
          - { name: dind-sock, mountPath: /var/run }
          - { name: dind-externals, mountPath: /home/runner/externals }
          - { name: docker-data, mountPath: /var/lib/docker }
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          # Test suites run here; GitHub-hosted runners give 4 vCPUs / 16 GB.
          limits: { cpu: "6", memory: 8Gi }
        volumeMounts:
          - { name: work, mountPath: /home/runner/_work }
          - { name: dind-sock, mountPath: /var/run }
    volumes:
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: longhorn-ci-scratch
              resources: { requests: { storage: 20Gi } }
      - name: docker-data
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: longhorn-ci-scratch
              resources: { requests: { storage: 60Gi } }
