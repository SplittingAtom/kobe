# Helm values for the dev loop (Tilt) and the k3d e2e suite.
global:
  # Tilt renders offline (helm template); throwaway clusters may generate secrets per render.
  allowGeneratedSecretsOffline: true
ingress:
  host: kobe.localtest.me
  tls:
    enabled: false
postgres:
  mode: external
  external:
    existingSecret: kobe-dev-db
s3:
  # dev/s3.yaml: SeaweedFS in kobe-deps (Apache-2.0; dev/e2e only, never in the chart).
  endpoint: http://s3.kobe-deps.svc.cluster.local:8333
  bucket: kobe
  existingSecret: kobe-dev-s3
# The e2e asserts a reconcile pass over the team namespace it creates (KOBE-126): run it often.
server:
  teamReconcileSeconds: 30
  # Small upload limit so the e2e can show a limit error with a 2 MiB file (KOBE-146).
  uploads:
    maxFileBytes: 1048576
# Small sandbox requests so dev clusters and the k3d e2e runner fit several sandboxes.
sandbox:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
smtp:
  # dev/mailpit.yaml: an in-cluster SMTP sink (web UI on port 8025). Plain SMTP, no credentials.
  host: mailpit.kobe-deps.svc.cluster.local
  port: 1025
  security: none
  from: "Kobe Dev <kobe@kobe.localtest.me>"
# The egress proxy reads allowlists from the dev Postgres (kobe-deps namespace).
egressProxy:
  networkPolicy:
    databasePeers:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kobe-deps
