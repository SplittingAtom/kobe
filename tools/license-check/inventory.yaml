        where: cluster (agent-sandbox-system); CRDs Sandbox, SandboxTemplate/Claim/WarmPool
        link: https://github.com/kubernetes-sigs/agent-sandbox/blob/v1.0.4/LICENSE
        images: []
        reason: >-
          Checked at v1.0.4: a single LICENSE (Apache-2.0) at the repository root, no NOTICE.
      - id: gvisor
        component: gVisor (runsc)
        version: 20260928.0 (scripts/install-gvisor-k3s.sh, scripts/dev-cluster.sh)
        license: Apache-2.0
        use: separate process (container runtime, cluster prerequisite)
