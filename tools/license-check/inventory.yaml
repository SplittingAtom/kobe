        license: Apache-2.0
        use: external (installs the chart)
        where: the operator's machine or CI
        link: https://github.com/helm/helm/blob/main/LICENSE
        images: []
      - id: cert-manager
        component: cert-manager
        version: chosen by the site
        license: Apache-2.0
        use: optional, external (`ingress.tls.clusterIssuer`)
        where: cluster
        link: https://github.com/cert-manager/cert-manager/blob/master/LICENSE
        images: []
      - id: cnpg
