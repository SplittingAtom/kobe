          their license files (LICENSE_DEJAVU, LICENSE_STIX); font licenses cover the fonts, not
          the charts made with them.
      - id: reportlab-fonts
        approval: { by: Chris, on: 2026-10-17, ref: KOBE-375 }
        component: Fonts in reportlab (Bitstream Vera, DarkGarden, Type 1 core-font substitutes)
        version: reportlab 5.0.1
        license: Bitstream-Vera AND GPL-2.0-or-later WITH Font-exception-2.0 AND BSD-3-Clause
        use: bundled (data files of a Python package)
        where: sandbox image (reportlab/fonts)
        link: https://github.com/MrBitBucket/reportlab-mirror/blob/master/LICENSE
        images: []
        reason: >-
          Font files shipped unmodified inside reportlab's wheel with their license files. The
          DarkGarden font is GPL with the font exception, so PDFs that embed it are not covered by
          the GPL; Kobe neither modifies nor links it.

# Every top-level key of charts/kobe/values.yaml: "first-party" (Kobe's own components),
# "site-provided" (a service the site operates; Kobe ships nothing) or the inventory rows it
