# Third-party inventory source (KOBE-375). `pnpm licenses:update` renders THIRD_PARTY_LICENSES.md
# and NOTICE from this file, pnpm-lock.yaml, the pnpm licenses report, the committed image reports
# (images/*/third-party-licenses.json) and the exception files; `pnpm license:check` fails when
# they are stale. Add a row here when you add an image (Dockerfile FROM, chart, dev or CI
# manifest), a chart dependency or an external service; the check names what is missing.
#
# Row fields: id, component, version, license (SPDX), use (linked / bundled / separate process /
# optional / external / dev-only / test-only), where, link (license text), images (normalised
# repositories the row covers: no tag, digest or docker.io/library prefix). A license outside
# the MIT/Apache/BSD/MPL family also needs `reason` and `approval: {by, on, ref}`; never add an
# approval Chris has not given (spec D3).

notice: |
  Kobe
  Copyright 2026 SplittingAtom

  This product is licensed under the Apache License, Version 2.0 (see LICENSE).

npm:
  title: "Web and services: npm packages (pnpm workspace)"
  intro: >-
    Every package in pnpm-lock.yaml (production and development, all platforms). "linked, bundled"
    packages are in the production dependencies of a deployable and ship in its image (the
    services via `pnpm deploy --prod`, web via the Next.js standalone output, kobe-sandbox-agent
    in the sandbox image); "dev-only" packages build, lint and test Kobe and are never shipped.
    Checked by `pnpm license:check` (CI `checks`).
  exceptions: tools/license-check/license-exceptions.json
  # Importers whose production dependencies ship in an image, and the image.
  deployables:
    apps/web: web
    services/server: server
    services/mcp-proxy: mcp-proxy
    services/egress-proxy: egress-proxy
    services/model-gateway: model-gateway
    services/sandbox-agent: sandbox
  # Native builds that only install on a matching OS/CPU; the license is the parent project's
  # and is compared with the report wherever the package is installed.
  platformPackages:
    - pattern: "@esbuild/*"
      license: MIT
      link: https://github.com/evanw/esbuild/blob/main/LICENSE.md
    - pattern: "@next/swc-*"
      license: MIT
      link: https://github.com/vercel/next.js/blob/canary/license.md
    - pattern: "@rolldown/binding-*"
      license: MIT
      link: https://github.com/rolldown/rolldown/blob/main/LICENSE
    - pattern: "@tailwindcss/oxide-*"
      license: MIT
      link: https://github.com/tailwindlabs/tailwindcss/blob/main/LICENSE
    - pattern: "@turbo/*"
      license: MIT
      link: https://github.com/vercel/turborepo/blob/main/LICENSE
    - pattern: "lightningcss-*"
      license: MPL-2.0
      link: https://github.com/parcel-bundler/lightningcss/blob/master/LICENSE
    - pattern: fsevents
      license: MIT
      link: https://github.com/fsevents/fsevents/blob/master/LICENSE
    - pattern: "@napi-rs/wasm-runtime"
      license: MIT
      link: https://github.com/napi-rs/napi-rs/blob/main/LICENSE
    - pattern: "@emnapi/*"
      license: MIT
      link: https://github.com/toyobayashi/emnapi/blob/main/LICENSE
    - pattern: "@tybys/wasm-util"
      license: MIT
      link: https://github.com/toyobayashi/wasm-util/blob/main/LICENSE
    - pattern: "@oxc-project/*"
      license: MIT
      link: https://github.com/oxc-project/oxc/blob/main/LICENSE
  # Packages whose reported license depends on the pnpm store (no license field in package.json).
  licenseOverrides:
    - package: khroma@2.1.0
      license: MIT
      reportedAs: [Unknown]
      reason: MIT in the repository and npm metadata; package.json has no license field (KOBE-130).

imageReports:
  - id: sandbox
    title: "Sandbox image: Python and npm packages"
    intro: >-
      What `images/sandbox/collect-licenses.sh` finds in the sandbox image (`kobe-sandbox`): the
      Python data stack (`images/sandbox/requirements.txt`), Pi and its dependencies
      (`images/sandbox/pi/package-lock.json`), kobe-sandbox-agent's production dependencies and
      the npm CLI. The committed report is `images/sandbox/third-party-licenses.json`; CI
      `sandbox-image` compares it with the built image and runs the policy check on it.
    image: sandbox
    report: images/sandbox/third-party-licenses.json
    exceptions: images/sandbox/license-exceptions.json
    locations:
      python: Python site-packages
      /opt/pi: Pi (/opt/pi)
      /opt/kobe/sandbox-agent: kobe-sandbox-agent
      /usr/local/lib: npm CLI (/usr/local/lib/node_modules)
  - id: orbit-eval
    title: "Orbit eval image: Python packages"
    intro: >-
      What the same script finds in the Orbit eval image (`kobe-orbit-eval`, KOBE-92): Orbit
      v1.0.3 and Inspect AI with their dependencies (`ci/orbit/requirements.txt`,
      `images/orbit-eval/orbit-requirements.txt`). The committed report is
      `images/orbit-eval/third-party-licenses.json`; CI `orbit-eval-image` compares it with the
      built image.
    image: orbit-eval
    report: images/orbit-eval/third-party-licenses.json
    exceptions: images/orbit-eval/license-exceptions.json
    locations:
      python: Python site-packages

npmLockfiles:
  - id: e2e-browser
    title: "Playwright browser suite: npm packages"
    path: e2e/browser/package-lock.json
    section: dev
    use: test-only
    where: e2e/browser (run against a deployment, not shipped)

sections:
  - id: images
    title: Container and base images
    intro: >-
      Base images of Kobe's own images (every Dockerfile FROM) and what they bring along. The Debian
      packages are separate, unmodified programs that agents or the image invoke; Kobe does not
      link against them. Native libraries that Python wheels bundle are listed here too.
    rows:
      - id: node-image
        component: Node.js official image (`node`)
        version: 24-slim (services, web); 22-trixie-slim, digest-pinned (sandbox build stages and the node binary in the sandbox)
        license: MIT
        use: bundled (base image; Node.js runs Kobe's services)
        where: images web, server, mcp-proxy, egress-proxy, model-gateway, sandbox
        link: https://github.com/nodejs/node/blob/main/LICENSE
        images: [node]
        reason: >-
          Node.js is MIT; its LICENSE lists the licenses of the libraries it bundles. The slim
          images are Debian-based (see the Debian base system row).
      - id: python-image
        approval: { by: Chris, on: 2026-10-17, ref: KOBE-375 }
        component: Python official image (`python`), CPython 3.12
        version: 3.12-slim-trixie, digest-pinned
        license: Python-2.0
        use: bundled (base image; separate process)
        where: images sandbox, orbit-eval
        link: https://docs.python.org/3.12/license.html
        images: [python]
        reason: >-
          The Python interpreter is a separate program that runs agents' code and the Orbit
          runner; the PSF license is permissive (BSD-style), not copyleft.
      - id: debian-base
        approval: { by: Chris, on: 2026-10-17, ref: KOBE-375 }
        component: Debian 13 (trixie) / 12 (bookworm) base system (libc6, bash, coreutils, perl-base, ...)
        version: as in the pinned base images
        license: GPL-2.0-or-later AND LGPL-2.1-or-later AND MIT AND BSD-3-Clause
        use: bundled (base image; separate programs and system libraries)
        where: every Kobe image
        link: https://www.debian.org/legal/licenses/
        images: []
        reason: >-
          The operating system of the base images, shipped unmodified; Kobe's programs run on it
          and use the C library through Node.js/Python, as every program on the system does.
          Per-package copyright files are in /usr/share/doc/<package>/copyright in each image.
      - id: debian-sandbox-tools
        approval: { by: Chris, on: 2026-10-17, ref: KOBE-375 }
        component: "Sandbox tools from Debian: git, less, procps"
        version: git 1:2.47.3-0+deb13u1, less 668-1, procps 2:4.0.4-9
        license: GPL-2.0-only AND (GPL-3.0-or-later OR BSD-2-Clause) AND GPL-2.0-or-later
        use: bundled (separate process)
        where: sandbox image
        link: https://sources.debian.org/src/git/1:2.47.3-0+deb13u1/debian/copyright/
        images: []
        reason: >-
          Separate, unmodified programs that agents invoke from the shell; Kobe does not link
          against them, so GPL obligations stay with those programs (source from Debian).
      - id: debian-sandbox-permissive
        approval: { by: Chris, on: 2026-10-17, ref: KOBE-375 }
        component: "Sandbox tools from Debian: curl, jq, ripgrep, file, zip, unzip, libcap2-bin, ca-certificates"
        version: curl 8.14.1-2+deb13u7, jq 1.7.1-6+deb13u4, ripgrep 14.1.1-1+b4, file 1:5.46-5, zip 3.0-15+deb13u1, unzip 6.0-29+deb13u1, libcap2-bin 1:2.75-10+deb13u1+b3, ca-certificates 20250419
        license: curl AND MIT AND (MIT OR Unlicense) AND BSD-2-Clause AND Info-ZIP AND (BSD-3-Clause OR GPL-2.0-only) AND MPL-2.0
        use: bundled (separate process)
        where: sandbox image
        link: https://www.debian.org/legal/licenses/
        images: []
        reason: >-
          Separate, unmodified programs (curl's and Info-ZIP's licenses are permissive, MIT-like);
          setcap from libcap2-bin is used at build time only.
      - id: tini
        component: tini
        version: 0.19.0-3+b8 (Debian)
        license: MIT
        use: bundled (separate process, PID 1)
        where: sandbox image
        link: https://github.com/krallin/tini/blob/master/LICENSE
        images: []
      - id: musl-static
        component: musl libc, statically linked into kobe-runas
        version: 1.2.5 (Debian trixie musl-dev, build stage)
        license: MIT
        use: linked (static) into kobe-runas
        where: sandbox image (/opt/kobe/bin/kobe-runas)
        link: https://git.musl-libc.org/cgit/musl/tree/COPYRIGHT
        images: []
        reason: >-
          kobe-runas is built -static-pie with musl-gcc against musl's start files and libc.a only
          (no glibc, no GCC crtbegin/crtend or libgcc; images/sandbox/Dockerfile), so the binary
          holds Kobe's code (Apache-2.0) and musl (MIT). Chose musl over glibc (LGPL-2.1):
          Chris, 2026-10-17.
      - id: wheel-native-libs
        approval: { by: Chris, on: 2026-10-17, ref: KOBE-375 }
        component: Native libraries bundled in Python wheels (numpy.libs, pillow.libs, pyarrow)
        version: as shipped in numpy 2.5.3, pillow 12.3.0, pyarrow 25.0.1
        license: BSD-3-Clause AND GPL-3.0-or-later WITH GCC-exception-3.1 AND FTL AND IJG AND libpng-2.0 AND libtiff AND MIT AND BSD-2-Clause AND Zlib AND Apache-2.0
        use: linked (by the Python packages that ship them)
        where: sandbox image
        link: https://github.com/python-pillow/Pillow/blob/main/LICENSE
        images: []
        reason: >-
          numpy bundles OpenBLAS (BSD-3-Clause) and libgfortran/libquadmath (GPL with the GCC
          Runtime Library Exception, which permits use in non-GPL programs); pillow bundles
          FreeType (FTL, BSD-style), libjpeg-turbo (IJG), libpng, libtiff, libwebp, lcms2,
          harfbuzz, zstd, brotli, libavif, openjpeg, xz and libxcb (permissive); pyarrow bundles
          Apache Arrow's C++ libraries (Apache-2.0, NOTICE included in NOTICE).

  - id: chart
    title: Chart and cluster components
    intro: >-
      What the Helm chart deploys or needs on the cluster, and the services it talks to. None of
      these are linked into Kobe's code. S3-compatible storage, SMTP, the audit SIEM and the
      OpenTelemetry backend are services the site operates (chart values `s3`, `smtp`,
      `auditForwarding`, `telemetry`); Kobe ships none of them. Every top-level key of
      charts/kobe/values.yaml is classified in `chartValues` in tools/license-check/inventory.yaml.
    rows:
      - id: pi
        component: Pi coding agent (`@earendil-works/pi-coding-agent`)
        version: 1.0.0 (pinned in images/sandbox/pi/package-lock.json)
        license: MIT
        use: bundled (separate process, RPC mode under kobe-sandbox-agent)
        where: sandbox image (/opt/pi); dependencies in the sandbox table
        link: https://github.com/earendil-works/pi/blob/v1.0.0/LICENSE
        images: []
        reason: >-
          Checked at v1.0.0: the repository has one LICENSE (MIT) at its root; the npm package
          declares MIT; packages/mcp/LICENSES holds the MIT license of the MCP TypeScript SDK.
      - id: agent-sandbox
