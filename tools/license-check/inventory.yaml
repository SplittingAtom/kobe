chartValues:
  global: first-party
  isolation: [gvisor, kata]
  sandbox: [agent-sandbox, pi, longhorn]
  rancher: [rancher]
  publicUrl: first-party
  auth: first-party
  smtp: site-provided
  web: first-party
  server: first-party
  scheduler: first-party
  mcpProxy: first-party
  envelope: first-party
  telemetry: [langfuse]
  egressProxy: first-party
  modelGateway: first-party
  bifrost: [bifrost]
  postgres: [cnpg, postgres]
  retention: first-party
  s3: site-provided
