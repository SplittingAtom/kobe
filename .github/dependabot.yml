# Keeps pinned inputs current: base image digests, GitHub Actions SHAs, npm/pnpm, and the sandbox's
# Pi lockfile and hashed Python lock. Every bump goes through CI (including the sandbox image scan).
version: 2
updates:
  - package-ecosystem: docker
    directories:
      [
        "/images/sandbox",
        "/images/bifrost",
        "/services/server",
        "/services/mcp-proxy",
        "/services/egress-proxy",
        "/services/model-gateway",
        "/apps/web",
      ]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directories: ["/", "/images/sandbox/pi"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    ignore:
      # Kobe runs on Node 24 (images and CI); the types follow the runtime's major version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /images/sandbox
    schedule: { interval: weekly }
