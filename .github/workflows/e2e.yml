# k3d end-to-end suite (KOBE-7): k3s clusters with gVisor and agent-sandbox, the chart installed
# from images built for this commit, then e2e/run.sh and the Gate 1 and 2 suites (e2e/gate1.sh,
# e2e/gate2.sh, e2e/gate3.sh). Runs on pull requests to main, in the merge queue, nightly, and on demand — not on
# every push.
#
# The images are built once (one job per image, Docker layers from the GitHub Actions cache that
# publish.yml fills on main) and shared as artifacts. The suite then runs as parallel shards, each
# on its own fresh cluster: `suite` (every e2e/run.sh section but the KOBE-25 cold-start trials),
# `cold-start` (the sections up to KOBE-25, with its trials), `gate1` (the install plus the
# KOBE-40 model setup, then e2e/gate1.sh), `gate2` (the same install, then e2e/gate2.sh), `gate3`
# (the same install, then e2e/gate3.sh with its browser checks in Playwright's Chromium) and
# `gate4` (the same install, then the Gate 4 checks no earlier gate makes, e2e/gate4/stories.sh) and
# `executor` (KOBE-168: the `suite` sections with the paired tool uid on, plus e2e/executor/) and
# `restore` (KOBE-233: a timed clean install, `kobe backup`, a new k3d cluster, `kobe restore`;
# e2e/gate4-restore.sh) and `gate5-a`/`gate5-b` (KOBE-227: Gate 5's U17-U24 in Chromium,
# e2e/gate5.sh). The gate shards keep their output; the `stories` job then gives one
# verdict per user story U1-U16 from them (e2e/gate4.sh, KOBE-232).
# Branch protection and the merge queue require the check named `k3d`: the last job, which passes
# only when every image build and every shard passed.
name: e2e

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# bash with pipefail (`bash --noprofile --norc -eo pipefail {0}`), not the default `bash -e`: the gate
# shards pipe their run through `tee`, and without pipefail tee's status hid every gate's FAILED.
defaults:
  run:
    shell: bash

env:
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
  KOBE_IMAGE_TAG: e2e-${{ github.sha }}
  # Downloads retry transient failures (a GitHub 502 on the k3d release must not fail the run).
  CURL_RETRY: --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20

jobs:
  # Docs-only pull requests skip the images and shards, but `k3d` must still report (it is a
  # required check), so the filter lives here rather than in `paths-ignore`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      # "true" unless this is a pull request that is a draft right now. Read live from the API, not
      # from the event: an agent that pushes and then marks the PR ready seconds later gets one run,
      # from the push, whose payload still says draft (the required checks were then skipped).
      ready: ${{ steps.filter.outputs.ready }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${EVENT}" != pull_request ]; then
            { echo "code=true"; echo "ready=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.draft')"
          if [ "${draft}" = true ]; then ready=false; else ready=true; fi
          echo "ready=${ready} (draft now: ${draft})" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"
          if grep -qvE '^docs/|\.md$' <<<"${files}"; then code=true; else code=false; fi
          echo "code=${code}" | tee -a "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.ready == 'true'
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.KOBE_BUILD_RUNNER || vars.KOBE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: server, dockerfile: services/server/Dockerfile }
          - { name: mcp-proxy, dockerfile: services/mcp-proxy/Dockerfile }
          - { name: egress-proxy, dockerfile: services/egress-proxy/Dockerfile }
          - { name: model-gateway, dockerfile: services/model-gateway/Dockerfile }
          - { name: sandbox, dockerfile: images/sandbox/Dockerfile }
          # KOBE-232: the pre-publish Orbit eval Job's image, for the gate4 shard only (its archive is
          # named e2e-extra-*, so the other shards don't download or import it).
          - { name: orbit-eval, dockerfile: images/orbit-eval/Dockerfile, archive: e2e-extra }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit's own image through the Docker Hub mirror (Docker Hub pulls fail from shared runner IPs).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          cleanup: false # the runner is thrown away; tearing the builder down cost ~15 s
          # Base images through Google's public Docker Hub mirror (anonymous Docker Hub pulls are
          # rate limited per IP); BuildKit falls back to Docker Hub for anything it lacks.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build ${{ matrix.name }} into an image archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ghcr.io/splittingatom/kobe-${{ matrix.name }}:${{ env.KOBE_IMAGE_TAG }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.archive || 'e2e-image' }}-${{ matrix.name }}.tar
          # Read-only: publish.yml writes these scopes on every push to main, which every pull
          # request and merge-queue run may read; PR runs don't spend the repository's cache quota.
          cache-from: type=gha,scope=${{ matrix.name }}
      # KOBE-138: the non-root assertion (formerly ci.yml's `images` job, which built every image a
      # second time) runs on the image just built. The sandbox image has its own checks
      # (images/sandbox/test-image.sh).
      - name: Assert ${{ matrix.name }} runs as a non-root user
        if: matrix.name != 'sandbox'
        run: |
          docker load --input "${RUNNER_TEMP}/${{ matrix.archive || 'e2e-image' }}-${{ matrix.name }}.tar"
          scripts/assert-image-nonroot.sh "ghcr.io/splittingatom/kobe-${{ matrix.name }}:${KOBE_IMAGE_TAG}"
      # KOBE-375: every image ships LICENSE, NOTICE and THIRD_PARTY_LICENSES.md (the sandbox image
      # is checked in sandbox-image.yml).
      - name: Assert ${{ matrix.name }} ships the license files
        if: matrix.name != 'sandbox'
        run: scripts/assert-image-licenses.sh "ghcr.io/splittingatom/kobe-${{ matrix.name }}:${KOBE_IMAGE_TAG}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # archive: false uploads the file as is (its layers are compressed already); the
          # artifact is named after it.
          path: ${{ runner.temp }}/${{ matrix.archive || 'e2e-image' }}-${{ matrix.name }}.tar
          archive: false
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # A required check (the main ruleset names it; it used to be a ci.yml job): passes when every
  # image built and is non-root. Docs-only changes skip the builds, and it still reports.
  images:
    needs: [changes, image]
    if: ${{ !cancelled() && needs.changes.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every image built and is non-root
        env:
          IMAGES: ${{ needs.image.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "code changed: ${CODE}, images: ${IMAGES}"
          if [ "${CODE}" = false ]; then echo "docs-only change: nothing to build"; exit 0; fi
          [ "${IMAGES}" = success ]

  e2e:
    name: e2e (${{ matrix.shard }})
    needs: image
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.KOBE_RUNNER || 'ubuntu-latest' }}
    # Healthy shards take about 10 min; under peak load the self-hosted runners' Docker data
    # (Longhorn on the nodes' HDDs) is far slower (ci/runners/README.md).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            suite,
            cold-start,
            gate1,
            gate2,
            gate3,
            gate4,
            gate5-a,
            gate5-b,
            gate-apps,
            executor,
            restore,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.34.6
      # KOBE-231: Gate 3's browser checks (e2e/browser/scripts/gate3-browser.mjs) run beside kubectl
      # in Playwright's Chromium, pinned by e2e/browser/package-lock.json.
      # KOBE-233: the restore shard runs the operator CLI (packages/cli) on the runner, as an operator
      # would, with PostgreSQL 17 client tools (docs/backup-restore.md, Requirements).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.shard == 'restore'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.shard == 'gate3' || matrix.shard == 'restore' || startsWith(matrix.shard, 'gate5') || matrix.shard == 'gate-apps'
        with:
          node-version-file: .nvmrc
          cache: ${{ matrix.shard == 'restore' && 'pnpm' || '' }}
      - name: The kobe CLI and PostgreSQL 17 client tools
        if: matrix.shard == 'restore'
        run: |
          pnpm install --frozen-lockfile --filter '@kobe/cli...'
          pnpm --filter '@kobe/cli...' run build
          if [ ! -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
            sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-common
          fi
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Playwright and Chromium for the browser checks
        if: matrix.shard == 'gate3' || startsWith(matrix.shard, 'gate5') || matrix.shard == 'gate-apps'
        run: |
          cd e2e/browser
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Runner prerequisites
        # The self-hosted runner image (ci/runners) is minimal; gVisor ships as .tar.bz2.
        run: command -v bzip2 >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends bzip2; }
      - name: Install k3d (checksum-verified)
        run: |
          # shellcheck disable=SC2086 # CURL_RETRY is a list of options
          curl -fsSL ${CURL_RETRY} -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - name: Docker Hub pulls through a mirror (GitHub-hosted runners)
        # The host's pulls (k3s, the k3d registry) try Google's public Docker Hub mirror first; the
        # daemon falls back to Docker Hub for anything it lacks. Self-hosted runners have their own
        # cache (ci/runners/dockerhub-mirror.yaml).
        if: runner.environment == 'github-hosted'
        run: |
          conf=/etc/docker/daemon.json
          { sudo cat "$conf" 2>/dev/null || echo '{}'; } \
            | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee "$conf.new" >/dev/null
          sudo mv "$conf.new" "$conf"
          sudo systemctl restart docker
          docker info --format 'mirrors: {{.RegistryConfig.Mirrors}}'
          df -h /
      - name: Raise inotify limits (k3s nodes need them)
        # Self-hosted runner nodes set these persistently (ci/runners/README.md); the runner
        # container there is unprivileged and cannot write sysctls.
        run: |
          if [ "$(cat /proc/sys/fs/inotify/max_user_instances)" -ge 1024 ]; then
            echo "inotify limits already sufficient"
          else
            sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          fi
      - name: Create k3d cluster with gVisor and agent-sandbox
        env:
          # The nodes' docker.io pulls: the self-hosted runners' cache (it does not resolve
          # elsewhere), or Google's public mirror on GitHub-hosted runners.
          KOBE_DOCKERHUB_MIRROR: ${{ runner.environment == 'github-hosted' && 'https://mirror.gcr.io' || 'http://dockerhub-mirror.kobe-ci-runners.svc.cluster.local:5000' }}
        run: scripts/dev-cluster.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-image-*
          path: ${{ runner.temp }}/e2e-images
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.shard == 'gate4'
        with:
          pattern: e2e-extra-*
          path: ${{ runner.temp }}/e2e-images
          merge-multiple: true
      - name: Load the images into k3d
        env:
          KOBE_IMAGE_ARCHIVES: ${{ runner.temp }}/e2e-images
          KOBE_E2E_EXTRA_IMAGES: ${{ matrix.shard == 'gate4' && 'orbit-eval' || '' }}
        run: |
          ls -lh "${KOBE_IMAGE_ARCHIVES}"
          e2e/load-images.sh kobe "${KOBE_IMAGE_TAG}"
          # The node now has its own copies (the restore shard loads them again into its second cluster).
          if [ "${{ matrix.shard }}" != restore ]; then rm -rf "${KOBE_IMAGE_ARCHIVES}"; fi
      - name: Run the ${{ matrix.shard }} shard
        env:
          KOBE_SANDBOX_IMAGE: ghcr.io/splittingatom/kobe-sandbox:${{ env.KOBE_IMAGE_TAG }}
          SHARD: ${{ matrix.shard }}
          # The nightly and manual runs also exercise the real ClamAV image (KOBE-146): its image and
          # signature download add minutes and ~1 GiB of memory, so pull requests leave it out.
          KOBE_E2E_CLAMAV: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.shard == 'suite' && '1' || '' }}
          # The restore shard creates a second cluster (scripts/dev-cluster.sh) and loads the images again.
          KOBE_DOCKERHUB_MIRROR: ${{ runner.environment == 'github-hosted' && 'https://mirror.gcr.io' || 'http://dockerhub-mirror.kobe-ci-runners.svc.cluster.local:5000' }}
          KOBE_IMAGE_ARCHIVES: ${{ matrix.shard == 'restore' && format('{0}/e2e-images', runner.temp) || '' }}
        run: |
          # Gate shards keep their output for the stories job; `shell: bash` (above) has pipefail,
          # so a gate's own exit status, not tee's, ends the step.
          logs="${RUNNER_TEMP}/gate-logs"
          mkdir -p "${logs}"
          case "${SHARD}" in
            suite | cold-start) KOBE_E2E_SHARD="${SHARD}" e2e/run.sh ;;
            # KOBE-168: the whole `suite` with sandbox.toolExecutor.enabled=true (Pi's tools in the
            # paired-uid executor), plus the isolation, cold-start and workspace-sync checks of
            # e2e/executor/. The chart default stays false; this proves it ready.
            executor) KOBE_E2E_SHARD=suite KOBE_E2E_TOOL_EXECUTOR=1 e2e/run.sh ;;
            # Gate 1 (KOBE-1) against a fresh install with the model setup it needs: two teams ×
            # five users, refresh mid-run, live cross-team probe, kill mid-run + Retry, 20
            # cold-start trials (docs/gates/gate-1.md).
            gate1) KOBE_E2E_SHARD=gate1-prep e2e/run.sh && e2e/gate1.sh 2>&1 | tee "${logs}/gate1.log" ;;
            # Gate 2 (KOBE-2) on its own cluster, in parallel with the other shards: budget stop,
            # request access, tampered kobe-policy, break-glass, secret scan (docs/gates/gate-2.md).
            gate2) KOBE_E2E_SHARD=gate1-prep e2e/run.sh && e2e/gate2.sh 2>&1 | tee "${logs}/gate2.log" ;;
            # Gate 3 (KOBE-3, KOBE-231) on its own cluster: agent versions, skills review and
            # blocklist, projects, memory with Undo and approvals, CSV to chart under CSP and the
            # lost sandbox (docs/gates/gate-3.md). KOBE_GATE3_BROWSER: the Chromium checks too.
            gate3) KOBE_E2E_SHARD=gate1-prep e2e/run.sh && KOBE_GATE3_BROWSER=1 e2e/gate3.sh 2>&1 | tee "${logs}/gate3.log" ;;
            # Gate 4 (KOBE-4, KOBE-232): the checks of U1, U2, U5-U8, U11, U14-U16 that Gates 1-3
            # don't make, against a fake OAuth MCP server and the Orbit test model (docs/gates/gate-4.md).
            gate4) KOBE_E2E_SHARD=gate1-prep e2e/run.sh && e2e/gate4/stories.sh 2>&1 | tee "${logs}/gate4.log" ;;
            # KOBE-233 (U16's backup half, docs/gates/gate-4.md): its own clean install, timed to the
            # first assistant token; kobe backup; this cluster deleted and a new one created; kobe restore.
            restore) e2e/gate4-restore.sh 2>&1 | tee "${logs}/restore.log" ;;
            # Gate 5 (KOBE-227, v1.1): U17-U24 in Chromium (e2e/browser) plus API checks, in two
            # halves on their own clusters to keep each shard short (docs/gates/gate-5.md).
            gate5-a) KOBE_E2E_SHARD=gate1-prep e2e/run.sh && KOBE_GATE5_STORIES="U17 U18 U19 U20" e2e/gate5.sh 2>&1 | tee "${logs}/gate5-a.log" ;;
            gate5-b) KOBE_E2E_SHARD=gate1-prep e2e/run.sh && KOBE_GATE5_STORIES="U21 U22 U23 U24" e2e/gate5.sh 2>&1 | tee "${logs}/gate5-b.log" ;;
            # The Kobe Explorer Gate (KOBE-441, MCP Apps): an app in the conversation, then from the
            # rail, against the fake MCP server's ui:// test app, in Chromium plus API checks
            # (docs/gates/gate-apps.md). The gate install's Catalyst run is the coordinator's.
            gate-apps) KOBE_E2E_SHARD=gate1-prep e2e/run.sh && e2e/gate-apps.sh 2>&1 | tee "${logs}/gate-apps.log" ;;
            *) echo "unknown shard ${SHARD}" >&2; exit 2 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (startsWith(matrix.shard, 'gate') || matrix.shard == 'restore') }}
        with:
          name: gate-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/gate-logs/
          retention-days: 7
          if-no-files-found: warn
      # Gate 5's Playwright report and traces (screenshots, DOM snapshots) when a browser check fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && (startsWith(matrix.shard, 'gate5') || matrix.shard == 'gate-apps') }}
        with:
          name: playwright-${{ matrix.shard }}
          path: |
            e2e/browser/test-results/
            e2e/browser/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n kobe-dev describe pods | tail -200 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl -n kobe-dev logs --all-containers --prefix --tail=50 -l app.kubernetes.io/name=kobe || true
          kubectl get sandboxes,sandboxclaims,sandboxwarmpools,networkpolicies -A || true
          kubectl -n kobe-team-e2e describe pods | tail -120 || true
          for t in a b; do kubectl -n kobe-team-gate1-$t describe pods | tail -60 || true; done
          kubectl -n kobe-team-gate2-a describe pods | tail -60 || true
          kubectl -n kobe-team-gate3-a describe pods,pvc | tail -80 || true
          kubectl -n kobe-team-gate4-a describe pods | tail -60 || true
          kubectl -n kobe-team-gate4-r describe pods,pvc | tail -60 || true
          kubectl -n kobe-team-gate5-a describe pods | tail -60 || true
          # The sandbox agent's own log (Pi starts, refusals) for the gate shards' members.
          for ns in kobe-team-gate5-a kobe-team-gate3-a kobe-team-gate4-a; do
            kubectl -n "$ns" logs -l agents.x-k8s.io/claim-uid --all-containers --prefix --tail=-1 2>/dev/null | grep -v '"level":30' | tail -200 || true
          done
          kubectl -n kobe-dev logs -l app.kubernetes.io/component=server -c server --tail=-1 2>/dev/null \
            | grep -E 'pi_rejected|pi_start|could not|run failed|"level":(40|50)' | tail -60 || true
          kubectl -n kobe-gate4-infra get pods -o wide || true
          kubectl -n kobe-gate2-infra get pods -o wide || true
          df -h /
          scripts/ci-docker-diagnostics.sh

  # Gate 4 (KOBE-232): one verdict per user story U1-U16 from the gate shards' output (no cluster).
  # Skipped when the shards were (an image failed): there are no logs then, and `k3d` already fails.
  stories:
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.changes.outputs.ready == 'true' && needs.changes.outputs.code == 'true' && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-log-*
          path: ${{ runner.temp }}/gate-logs
          merge-multiple: true
      - name: U1-U16, each from the checks that prove it
        env:
          KOBE_GATE4_LOGS: ${{ runner.temp }}/gate-logs
        run: |
          if [ ! -d "${KOBE_GATE4_LOGS}" ]; then
            echo "::error::no gate-log-* artifacts: no gate shard kept its output"
            exit 1
          fi
          ls -l "${KOBE_GATE4_LOGS}"
          rc=0
          # Every gate run reached its verdict and none says FAILED (gate5 too), then U1-U16.
          e2e/gate-verdicts.sh "${KOBE_GATE4_LOGS}" | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          KOBE_GATE4_VERDICT_ONLY=1 e2e/gate4.sh | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          exit "$rc"

  # The required check (branch protection and the merge-queue ruleset name it): passes only when
  # every image built, every shard passed and every story is proven. Skipped for draft PRs, as the
  # suite is.
  k3d:
    needs: [changes, image, e2e, stories]
    if: ${{ !cancelled() && needs.changes.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every image build and e2e shard passed
        env:
          IMAGES: ${{ needs.image.result }}
          SHARDS: ${{ needs.e2e.result }}
          STORIES: ${{ needs.stories.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "code changed: ${CODE}, images: ${IMAGES}, shards: ${SHARDS}, stories: ${STORIES}"
          if [ "${CODE}" = false ]; then echo "docs-only change: nothing to test"; exit 0; fi
          [ "${IMAGES}" = success ] && [ "${SHARDS}" = success ] && [ "${STORIES}" = success ]
