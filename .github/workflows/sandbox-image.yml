# Builds, tests and scans the Kobe sandbox image (KOBE-21). The image is large (~1.4 GB), so it runs
# only when its inputs change, nightly (to catch new CVEs), and on demand.
name: sandbox-image

on:
  push:
    paths:
      - images/sandbox/**
      - services/sandbox-agent/**
      - packages/**
      - tools/license-check/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - .dockerignore
      - .github/workflows/sandbox-image.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.KOBE_BUILD_RUNNER || vars.KOBE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker Hub pulls through a mirror (GitHub-hosted runners)
        # Anonymous Docker Hub pulls from shared runner IPs get rate limited or fail (504s on
        # 2026-10-09); the daemon tries Google's mirror first and falls back to Docker Hub.
        if: runner.environment == 'github-hosted'
        run: |
          conf=/etc/docker/daemon.json
          { sudo cat "$conf" 2>/dev/null || echo '{}'; } \
            | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee "$conf.new" >/dev/null
          sudo mv "$conf.new" "$conf"
          sudo systemctl restart docker
          docker info --format 'mirrors: {{.RegistryConfig.Mirrors}}'
      - name: Build
        run: docker build -f images/sandbox/Dockerfile -t kobe-sandbox:ci . || { scripts/ci-docker-diagnostics.sh; exit 1; }
      - name: Acceptance checks (hardened run, Pi 1.0.x, Python data stack, no setuid/secrets)
        run: images/sandbox/test-image.sh kobe-sandbox:ci
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: License audit of bundled Python and npm packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kobe/license-check build
          images/sandbox/collect-licenses.sh kobe-sandbox:ci > "$RUNNER_TEMP/sandbox-licenses.json"
          LICENSE_REPORT="$RUNNER_TEMP/sandbox-licenses.json" \
          LICENSE_EXCEPTIONS="$PWD/images/sandbox/license-exceptions.json" \
            node tools/license-check/dist/cli.js
      - name: Vulnerability report (HIGH and CRITICAL with fixes available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kobe-sandbox:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - name: Vulnerability gate (fail on any fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kobe-sandbox:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
