# Publishes images and the Helm chart to private ghcr.io/splittingatom on every push to main
# (KOBE-7). Images are tagged sha-<short> (immutable) and main; the chart version is
# <Chart.version>-main.<run>, with appVersion sha-<short> so it pins exactly these images.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: server, dockerfile: services/server/Dockerfile }
          - { name: mcp-proxy, dockerfile: services/mcp-proxy/Dockerfile }
          - { name: egress-proxy, dockerfile: services/egress-proxy/Dockerfile }
          - { name: sandbox, dockerfile: images/sandbox/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        run: echo "short=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/splittingatom/kobe-${{ matrix.name }}:${{ steps.tag.outputs.short }}
            ghcr.io/splittingatom/kobe-${{ matrix.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  chart:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - name: Package and push chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(grep '^version:' charts/kobe/Chart.yaml | awk '{print $2}')
          version="${base}-main.${GITHUB_RUN_NUMBER}"
          helm package charts/kobe --version "$version" --app-version "sha-${GITHUB_SHA::12}" -d dist
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/kobe-${version}.tgz" oci://ghcr.io/splittingatom/charts
