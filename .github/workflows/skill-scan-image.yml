# Builds, tests and scans the optional external skill scanner image (KOBE-341). Path-filtered so
# unrelated PRs skip it; also nightly (new CVEs) and on demand. Mirrors orbit-eval-image.yml.
name: skill-scan-image

on:
  push:
    paths:
      - images/skill-scan/**
      - images/sandbox/collect-licenses.sh
      - tools/license-check/**
      - scripts/assert-image-licenses.sh
      - .dockerignore
      - .github/workflows/skill-scan-image.yml
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

concurrency:
  group: skill-scan-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.KOBE_BUILD_RUNNER || vars.KOBE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docker Hub pulls through a mirror (GitHub-hosted runners)
        # Anonymous Docker Hub pulls from shared runner IPs get rate limited or fail (504s on
        # 2026-10-09); the daemon tries Google's mirror first and falls back to Docker Hub.
        if: runner.environment == 'github-hosted'
        run: |
          conf=/etc/docker/daemon.json
          { sudo cat "$conf" 2>/dev/null || echo '{}'; } \
            | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee "$conf.new" >/dev/null
          sudo mv "$conf.new" "$conf"
          sudo systemctl restart docker
          docker info --format 'mirrors: {{.RegistryConfig.Mirrors}}'
      - name: Build
        run: docker build -f images/skill-scan/Dockerfile -t kobe-skill-scan:ci . || { scripts/ci-docker-diagnostics.sh; exit 1; }
      - name: Acceptance checks (hardened run without network, a planted package, a bad path)
        run: images/skill-scan/test-image.sh kobe-skill-scan:ci
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: License audit of bundled Python packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kobe/license-check build
          images/sandbox/collect-licenses.sh kobe-skill-scan:ci > "$RUNNER_TEMP/skill-scan-licenses.json"
          LICENSE_REPORT="$RUNNER_TEMP/skill-scan-licenses.json" \
          LICENSE_EXCEPTIONS="$PWD/images/skill-scan/license-exceptions.json" \
            node tools/license-check/dist/cli.js
      # KOBE-375: the committed report (THIRD_PARTY_LICENSES.md and NOTICE are rendered from it in
      # the `checks` job) must match the image; on a mismatch the fresh report is uploaded.
      - name: Committed license report matches the image
        run: |
          node tools/license-check/dist/inventory-cli.js image-report skill-scan \
            "$RUNNER_TEMP/skill-scan-licenses.json" --check
      - name: Upload the fresh license report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-scan-third-party-licenses
          path: ${{ runner.temp }}/skill-scan-licenses.json
          retention-days: 7
      - name: The image ships LICENSE, NOTICE and THIRD_PARTY_LICENSES.md
        run: scripts/assert-image-licenses.sh kobe-skill-scan:ci
      - name: Vulnerability report (HIGH and CRITICAL with fixes available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kobe-skill-scan:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - name: Vulnerability gate (fail on any fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kobe-skill-scan:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
