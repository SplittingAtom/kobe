# Unit-level CI on every push; its checks also report on the PR for that branch. Private-repo
# minutes are metered (spec D3), so there is no duplicate pull_request trigger here; the k3d
# end-to-end suite runs only on PRs to main and nightly (added in KOBE-7).
name: ci

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ vars.KOBE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # Node sees the node's CPUs, not the runner's limit; cap parallel suites so per-test
      # timeouts don't trip on self-hosted runners (ci/runners).
      - run: pnpm test --concurrency=2
      - run: pnpm license:check

  db:
    # Migrations from scratch + RLS catalog check + cross-team probe suite, on every push (spec D5).
    runs-on: ${{ vars.KOBE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      KOBE_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # kobe backup/restore tests run the real pg_dump, pg_restore and psql; the runner's own
      # client is older than the server (pg_dump refuses newer servers), so add 17 from PGDG.
      - name: PostgreSQL 17 client
        run: |
          # Self-hosted runners (ci/runners) start from a minimal image without postgresql-common.
          if [ ! -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
            sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-common
          fi
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Migrations match the Drizzle schema
        run: pnpm --filter @kobe/db exec drizzle-kit check && pnpm db:check
      - name: RLS catalog check and cross-team probe suite
        run: pnpm test:db

  images:
    runs-on: ${{ vars.KOBE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build every service image and assert non-root
        run: scripts/check-images.sh
