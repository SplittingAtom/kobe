# Unit-level CI on every push; its checks also report on the PR for that branch. Private-repo
# minutes are metered (spec D3), so there is no duplicate pull_request trigger here; the k3d
# end-to-end suite runs only on PRs to main and nightly (added in KOBE-7).
name: ci

on:
  push:
    # The merge queue's temporary branches are checked via merge_group below.
    branches-ignore: ["gh-readonly-queue/**"]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# bash with pipefail for every step, as in e2e.yml: a failing command before a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.KOBE_RUNNER || 'ubuntu-24.04' }}
    # 14-15 min on hosted runners since 2026-10 (the queue run of #400 hit 15 min inside
    # license:check with every step green); 25 only bounds a hang, a healthy run stays ~15.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - run: pnpm install --frozen-lockfile
      - name: No infrastructure details in tracked files (public repo)
        run: scripts/check-public-hygiene.sh
      - name: Nothing people read calls the scope "install" (KOBE-257)
        run: scripts/check-site-wording.mjs
      # The pinned Pi (sandbox image lockfile) for kobe-sandbox-agent's real-Pi integration test.
      - run: npm ci --prefix images/sandbox/pi --omit=dev --ignore-scripts --no-audit --no-fund
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # Node sees the node's CPUs, not the runner's limit (6 CPUs, ci/runners); cap parallel
      # suites and each suite's vitest workers (2 × 3) so per-test timeouts and worker start-up
      # don't trip on self-hosted runners. Every package's test script is `vitest run`.
      - run: pnpm test --concurrency=2 -- --maxWorkers=3
      # KOBE-71: Pi identities with the real kobe-runas helper (needs sudo to install it with
      # file capabilities and to give the test its supplementary groups).
      - name: Sandbox privilege separation (real helper)
        run: services/sandbox-agent/scripts/test-identities.sh
      # KOBE-193: Gate 2's harness fails once, clearly, on a sandbox that is not running, and its
      # secret scan says INVALID (never ok) when its controls fail; a fake kubectl, no cluster.
      - name: Gate 2 harness failure paths
        run: e2e/gate2/sandbox.test.sh
      - run: pnpm license:check

  # Migrations from scratch + RLS catalog check + cross-team probe suite, on every push (spec D5).
  # KOBE-300: the server's test:db (~13 min serial) runs in the db-server shards beside this job;
  # every other package's test:db, the schema check and the upgrade path stay here.
  db-core:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.KOBE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      KOBE_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not a service container: its pull cannot be retried, and the Docker Hub mirror (anonymous
      # Docker Hub pulls from shared runner IPs fail, 2026-10-09) sometimes answers 429 (KOBE-415).
      - name: PostgreSQL 17 (pulled with retries)
        run: scripts/ci-postgres.sh ci-only
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # kobe backup/restore tests run the real pg_dump, pg_restore and psql; the runner's own
      # client is older than the server (pg_dump refuses newer servers), so add 17 from PGDG.
      - name: PostgreSQL 17 client
        run: |
          # Self-hosted runners (ci/runners) start from a minimal image without postgresql-common.
          if [ ! -x /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh ]; then
            sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends postgresql-common
          fi
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Migrations match the Drizzle schema
        run: pnpm --filter @kobe/db exec drizzle-kit check && pnpm db:check
      - name: RLS catalog check and cross-team probe suite (every package but the server)
        run: pnpm test:db --filter='!@kobe/server'
      # KOBE-69: an existing install runs only migrations newer than its last one, so also migrate a
      # database to the base branch's migrations (PR base, or the merge queue's base), then to this
      # branch's with the chart's runner, and run the catalog check and probe suite against it.
      - name: Upgrade path (base migrations, then this branch) with catalog check and probe suite
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          KOBE_TEST_BASE_MIGRATIONS="$(scripts/upgrade-base-migrations.sh)"
          export KOBE_TEST_BASE_MIGRATIONS
          echo "upgrading from base migrations in $KOBE_TEST_BASE_MIGRATIONS"
          pnpm --filter @kobe/db exec vitest run -c vitest.db.config.ts src/catalog.db.test.ts src/probe.db.test.ts

  # The server's Postgres-backed suites (KOBE-300), split by file across shards, each on its own
  # Postgres. Every file opens its own throwaway database, so files also run in parallel within a
  # shard (KOBE_DB_TEST_WORKERS; each file peaks at ~12 connections, within max_connections 100).
  db-server:
    name: db-server (${{ matrix.shard }}/2)
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.KOBE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      KOBE_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
      KOBE_DB_TEST_WORKERS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not a service container: its pull cannot be retried, and the Docker Hub mirror (anonymous
      # Docker Hub pulls from shared runner IPs fail, 2026-10-09) sometimes answers 429 (KOBE-415).
      - name: PostgreSQL 17 (pulled with retries)
        run: scripts/ci-postgres.sh ci-only
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Server test:db, shard ${{ matrix.shard }} of 2
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm test:db --filter=@kobe/server -- --shard="${SHARD}/2"

  # The required check (branch protection and the merge-queue ruleset name `db`): passes only when
  # db-core and every db-server shard passed (KOBE-300 split the old single db job).
  db:
    needs: [db-core, db-server]
    # always(): a skipped required check counts as passed, so this job must run (and fail)
    # even when a shard was cancelled or skipped.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: db-core and every db-server shard passed
        env:
          CORE: ${{ needs.db-core.result }}
          SHARDS: ${{ needs.db-server.result }}
        run: |
          echo "db-core: ${CORE}, db-server shards: ${SHARDS}"
          [ "${CORE}" = success ] && [ "${SHARDS}" = success ]

  orbit-loader:
    # KOBE-90: the Orbit export mapper's fixtures load in Orbit's real YAML loader. Own job so the
    # required `checks` job stays fast. Pins: Orbit v1.0.3 (commit below, keep in step with
    # ORBIT_PIN in services/server/src/agents/orbit/orbit-schema.ts); its dependencies come from
    # Orbit's uv.lock with hashes (ci/orbit/requirements.txt).
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-24.04') || vars.KOBE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/orbit/requirements.txt
      - run: pip install --require-hashes --no-deps -r ci/orbit/requirements.txt
      - run: pip install --no-deps https://github.com/wlanderson0/orbit/archive/588b3035f92450ec4f0496bb8b629daa205e84c7.tar.gz
      - run: python ci/orbit/check-fixtures.py
