# Weekly dependency audit (KOBE-692, review SEC-3): GitHub's dependency graph does not read the
# pnpm 12 lockfile, so the repository gets no Dependabot alerts. This job fails on a HIGH or
# CRITICAL advisory in the shipped npm packages (`pnpm audit --prod`) or in the images' pinned
# Python and npm packages (OSV, scripts/osv-audit.mjs). Only package names and versions are sent.
name: security-audit

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/osv-audit.mjs
      - scripts/osv-audit.test.mjs
      - .github/workflows/security-audit.yml
      - .github/actions/setup-kobe/**

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm audit reads the lockfile only: no install, no store cache.
      - uses: ./.github/actions/setup-kobe
        with:
          node-cache: ""
          install-args: ""
      - name: OSV audit script tests
        run: node --test scripts/osv-audit.test.mjs
      # Both audits run, so one report does not hide the other; the job fails if either found one.
      - name: npm packages shipped in the images (pnpm audit --prod, high and critical)
        id: npm
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      - name: Image Python and npm pins against OSV (high and critical)
        id: osv
        continue-on-error: true
        run: |
          node scripts/osv-audit.mjs \
            images/sandbox/requirements.txt \
            images/sandbox/pi/package-lock.json \
            ci/orbit/requirements.txt \
            images/skill-scan/requirements.txt \
            images/skill-scan/scanner-requirements.txt \
            e2e/browser/package-lock.json
      - name: Verdict
        env:
          NPM: ${{ steps.npm.outcome }}
          OSV: ${{ steps.osv.outcome }}
        run: |
          echo "pnpm audit: ${NPM}, OSV: ${OSV}"
          [ "${NPM}" = success ] && [ "${OSV}" = success ]
