{{- $e := include "kobe.egressProxyValues" . | fromJson -}}
{{- if not $e.headerSecret -}}
{{- include "kobe.requireOnlineToGenerate" (dict "root" . "what" "the egress header secret" "value" "egressProxy.headerSecret") -}}
{{- $name := include "kobe.egressHeaderSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := ($existing).data | default dict -}}
# secret: seals the headers team admins inject for egress domains (KOBE-39) in Postgres. Held by the
# server (seals) and the egress proxy (opens) only; sandboxes never see it or the values. Rotation:
# put the old value under secret-previous and a new one under secret, then restart both; values
# sealed with the old one keep working (re-enter them to re-seal) until secret-previous is removed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret: {{ ternary (index $data "secret" | default "" | b64dec) (randAlphaNum 48) (hasKey $data "secret") | quote }}
  {{- if hasKey $data "secret-previous" }}
  secret-previous: {{ index $data "secret-previous" | b64dec | quote }}
  {{- end }}
{{- end }}
