{{- $s := include "kobe.ssoValues" . | fromJson -}}
{{- $np := $s.networkPolicy -}}
{{- if and $s.enabled $np.enabled }}
{{- $fullname := include "kobe.fullname" . }}
# Single sign-on (KOBE-626): lets the server pods reach the identity provider (discovery, keys,
# token endpoint) where the namespace denies egress by default. NetworkPolicies add up: this one
# only allows; it does not restrict anything another policy allows. It does select the server pods
# for Egress, so enable it beside your own allows for the server's other destinations.
# Entra ID: login.microsoftonline.com on 443 (addresses not fixed: the default is public ranges).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-server-sso-egress
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if $np.cidrs }}
    {{- range $np.cidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        {{- range $s.allowedPorts }}
        - protocol: TCP
          port: {{ int . }}
        {{- end }}
    {{- end }}
    {{- else }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml (include "kobe.egressPrivateRanges" . | fromJsonArray) | nindent 14 }}
      ports:
        {{- range $s.allowedPorts }}
        - protocol: TCP
          port: {{ int . }}
        {{- end }}
    {{- end }}
    {{- range $s.allowedInternalCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        {{- range $s.allowedPorts }}
        - protocol: TCP
          port: {{ int . }}
        {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
