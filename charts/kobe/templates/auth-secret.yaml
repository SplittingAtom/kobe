{{- if not (.Values.auth).existingSecret -}}
{{- include "kobe.requireOnlineToGenerate" (dict "root" . "what" "the auth secret" "value" "auth.existingSecret") -}}
{{- $name := include "kobe.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := ($existing).data | default dict -}}
{{- $secret := ternary (index $data "secret" | default "" | b64dec) (randAlphaNum 48) (hasKey $data "secret") -}}
{{- $setup := ternary (index $data "setup-token" | default "" | b64dec) (randAlphaNum 32) (hasKey $data "setup-token") -}}
# secret: signs session cookies and encrypts TOTP secrets, backup codes and JWT signing keys.
#   Rotating it signs everyone out AND makes enrolled 2FA unusable; it is kept across upgrades and
#   uninstalls. Rotate only with Better Auth's versioned `secrets` support.
# setup-token: proves possession of the install for first-run setup (see NOTES).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret: {{ $secret | quote }}
  setup-token: {{ $setup | quote }}
{{- end }}
