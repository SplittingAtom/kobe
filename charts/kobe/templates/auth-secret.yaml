{{- if not (.Values.auth).existingSecret -}}
{{- $name := include "kobe.authSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secret := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "secret") -}}
{{- $secret = index $existing.data "secret" | b64dec -}}
{{- else -}}
{{- $secret = randAlphaNum 48 -}}
{{- end -}}
# Signs session cookies and encrypts JWT signing keys. Kept across upgrades and uninstalls
# (rotating it signs everyone out). For GitOps/offline renders set auth.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret: {{ $secret | quote }}
{{- end }}
