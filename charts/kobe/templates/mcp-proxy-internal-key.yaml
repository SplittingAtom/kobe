{{- $m := include "kobe.mcpProxyValues" . | fromJson -}}
{{- if not $m.internalKeySecret -}}
{{- include "kobe.requireOnlineToGenerate" (dict "root" . "what" "the MCP proxy internal key" "value" "mcpProxy.internalKeySecret") -}}
{{- $name := include "kobe.mcpInternalKeySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := ($existing).data | default dict -}}
# key: what the MCP proxy presents to the server's internal listener (policy re-check, KOBE-58).
# Held by the server and the MCP proxy only. Rotating it (delete the Secret, upgrade) needs both
# to restart; calls in between are refused.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key: {{ ternary (index $data "key" | default "" | b64dec) (randAlphaNum 48) (hasKey $data "key") | quote }}
{{- end }}
