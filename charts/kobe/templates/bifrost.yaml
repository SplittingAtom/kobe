{{- $fullname := include "kobe.fullname" . -}}
{{- $sel := dict "root" . "component" "bifrost" -}}
{{- $b := include "kobe.bifrostValues" . | fromJson -}}
# Bifrost model gateway (spec D4, D30): provider keys, catalog models, the customer/team/virtual-key
# hierarchy. Kobe is the source of truth: the server pushes everything (KOBE-40), so Bifrost's own
# store is a cache that persistence only keeps across restarts (virtual keys, budget counters).
# Sandboxes never reach it directly: only the model-gateway shim and the server may (its
# NetworkPolicy in networkpolicies.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-bifrost
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
data:
  config.json: |
    {{- include "kobe.bifrostConfig" . | nindent 4 }}
---
{{- if $b.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-bifrost
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $b.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $b.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-bifrost
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
    app.kubernetes.io/component: bifrost
spec:
  # One replica (values schema): virtual keys and budget counters live in this pod's store.
  replicas: {{ $b.replicas }}
  # Never two at once (a rolling update would briefly run a second, empty store).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kobe.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kobe.selectorLabels" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ include "kobe.bifrostConfig" . | sha256sum }}
    spec:
      {{- include "kobe.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ $fullname }}-workload
      automountServiceAccountToken: false
      {{- include "kobe.podSecurityContext" . | nindent 6 }}
      containers:
        - name: bifrost
          image: {{ include "kobe.bifrostImage" . | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "kobe.containerSecurityContext" . | nindent 10 }}
          env:
            - name: BIFROST_ADMIN_USERNAME
              value: kobe
            - name: BIFROST_ADMIN_PASSWORD
              {{- include "kobe.modelKeyRef" (dict "root" . "key" "bifrost-admin-password") | nindent 14 }}
            - name: BIFROST_ENCRYPTION_KEY
              {{- include "kobe.modelKeyRef" (dict "root" . "key" "bifrost-encryption-key") | nindent 14 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          # As for Kobe's services (_helpers.tpl): liveness starts once Bifrost has started.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            # Read-only config (no secrets in it) inside the writable data directory.
            - name: config
              mountPath: /app/data/config.json
              subPath: config.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if $b.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-bifrost
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ $fullname }}-bifrost
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-bifrost
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
    app.kubernetes.io/component: bifrost
spec:
  selector:
    {{- include "kobe.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
