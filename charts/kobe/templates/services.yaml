{{- include "kobe.validateDatabase" . -}}
{{- $fullname := include "kobe.fullname" . -}}
{{- $dbAnnotations := include "kobe.dbChecksumAnnotations" . -}}
{{- $common := printf "%s\n%s" (include "kobe.databaseEnv" .) (include "kobe.s3Env" .) -}}
{{- /* The server has no isolation initContainer: it checks in process and keeps serving the
  admin console without isolation, agents disabled (spec D4, KOBE-9). The scheduler, which has no
  UI, still refuses to start. Both re-check at runtime. */ -}}
{{- $runtime := printf "- name: KOBE_RUNTIME_CLASS\n  value: %s" (.Values.isolation.runtimeClassName | quote) -}}
{{- include "kobe.nodeService" (dict "root" . "component" "web" "image" "web" "values" .Values.web
      "healthPath" "/api/healthz" "readyPath" "/api/healthz"
      "extraMounts" "- name: next-cache\n  mountPath: /app/apps/web/.next/cache"
      "extraVolumes" "- name: next-cache\n  emptyDir: {}") }}
---
{{ include "kobe.nodeService" (dict "root" . "component" "server" "image" "server" "values" .Values.server
      "serviceAccount" (printf "%s-server" $fullname) "automountToken" true "migrations" true
      "annotations" $dbAnnotations
      "extraPorts" "- name: sandbox\n  containerPort: 8081"
      "extraServicePorts" "- name: sandbox\n  port: 8081\n  targetPort: sandbox"
      "env" (printf "- name: KOBE_PROCESS\n  value: server\n%s\n%s\n%s\n%s\n%s" $runtime $common (include "kobe.authEnv" .) (include "kobe.smtpEnv" .) (include "kobe.sandboxEnv" .))) }}
---
{{ include "kobe.nodeService" (dict "root" . "component" "scheduler" "image" "server" "values" .Values.scheduler
      "serviceAccount" (printf "%s-server" $fullname) "automountToken" true "preflight" true "migrations" true
      "annotations" $dbAnnotations
      "env" (printf "- name: KOBE_PROCESS\n  value: scheduler\n%s\n%s" $runtime $common)) }}
---
{{ include "kobe.nodeService" (dict "root" . "component" "mcp-proxy" "image" "mcp-proxy" "values" .Values.mcpProxy) }}
---
{{ include "kobe.nodeService" (dict "root" . "component" "egress-proxy" "image" "egress-proxy" "values" .Values.egressProxy) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
