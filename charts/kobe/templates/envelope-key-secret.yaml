{{- if not (.Values.envelope).keySecret -}}
{{- include "kobe.requireOnlineToGenerate" (dict "root" . "what" "the envelope key" "value" "envelope.keySecret") -}}
{{- $name := include "kobe.envelopeSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := ($existing).data | default dict -}}
# key: install key-encryption key (KEK) for envelope encryption of per-record secrets (connector
#   credentials, KOBE-107). Held by the API server only; never rendered into values or logs. Kept
#   across upgrades and uninstalls (losing it makes every sealed credential unreadable: back it
#   up). Rotation: move the old value to `key-previous`, put a new one in `key`, restart the
#   server; ciphertexts name their key id and re-wrap lazily.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key: {{ ternary (index $data "key" | default "" | b64dec) (randAlphaNum 48) (hasKey $data "key") | quote }}
  {{- if hasKey $data "key-previous" }}
  key-previous: {{ index $data "key-previous" | b64dec | quote }}
  {{- end }}
{{- end }}
