{{- $serverUser := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "kobe.serverServiceAccount" .) -}}
{{- $manager := include "kobe.sandboxManagerRole" . -}}
{{- $handler := "^(runsc|kata(-[a-z0-9]+)*)$" -}}
{{- $inTeam := "request.namespace.startsWith('kobe-team-')" -}}
{{- $scope := include "kobe.clusterName" (dict "root" . "suffix" "server-scope") -}}
{{- $pods := include "kobe.clusterName" (dict "root" . "suffix" "sandbox-pods") -}}
{{- $specs := include "kobe.clusterName" (dict "root" . "suffix" "sandbox-specs") -}}
{{- $netpol := include "kobe.clusterName" (dict "root" . "suffix" "sandbox-netpol") -}}
# Admission policies for sandbox isolation (spec D4, D11; KOBE-9 binding requirement 3). They close
# the window between the server's isolation check and pod creation, cover pods the agent-sandbox
# controller creates on its own (warm pool), and confine the server's cluster-wide RBAC.
# failurePolicy Fail: if a policy cannot be evaluated, the request is refused.
#
# 1. The server's ServiceAccount may write namespaces and RoleBindings only in kobe-team-*:
#    namespaces labelled as team namespaces under Pod Security "restricted"; RoleBindings granting
#    the sandbox manager role to the server only.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $scope }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: kobe-server
      expression: {{ printf "request.userInfo.username == '%s'" $serverUser | quote }}
  variables:
    - name: isNamespace
      expression: "request.resource.resource == 'namespaces'"
    - name: target
      expression: "variables.isNamespace ? request.name : request.namespace"
    - name: labels
      expression: "request.operation != 'DELETE' && variables.isNamespace && has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
    - expression: "variables.target.startsWith('kobe-team-')"
      messageExpression: "'Kobe may only manage kobe-team-* namespaces, not ' + variables.target"
    - expression: >-
        !variables.isNamespace || request.operation == 'DELETE' ||
        (variables.labels[?'kobe.splittingatom.io/team-namespace'].orValue('') == 'true' &&
         variables.labels[?'pod-security.kubernetes.io/enforce'].orValue('') == 'restricted')
      message: "team namespaces must be labelled as such and enforce Pod Security 'restricted'"
    - expression: >-
        variables.isNamespace || request.operation == 'DELETE' ||
        (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == '{{ $manager }}' &&
         has(object.subjects) && object.subjects.all(s, s.kind == 'ServiceAccount' &&
           s.name == '{{ include "kobe.serverServiceAccount" . }}' && s.namespace == '{{ .Release.Namespace }}'))
      message: "Kobe may only bind its sandbox manager role to its own server"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $scope }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  policyName: {{ $scope }}
  validationActions: ["Deny"]
---
# 2. Every pod in a kobe-team-* namespace runs under the configured RuntimeClass, whose handler
#    must be gVisor or Kata (checked against the live RuntimeClass object: the param), and carries
#    no credentials: no Secret volumes or env, no API token, no host namespaces or hostPath, and
#    projected ServiceAccount tokens only for the Kobe bootstrap audience.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $pods }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: node.k8s.io/v1
    kind: RuntimeClass
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: team-namespace
      expression: {{ $inTeam | quote }}
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: volumes
      expression: "has(object.spec.volumes) ? object.spec.volumes : []"
  validations:
    - expression: "object.spec.?runtimeClassName.orValue('') == params.metadata.name"
      messageExpression: "'sandbox pods must use RuntimeClass ' + params.metadata.name"
    - expression: {{ printf "params.handler.matches('%s')" $handler | quote }}
      messageExpression: "'RuntimeClass ' + params.metadata.name + ' has handler ' + params.handler + ', which is not gVisor (runsc) or Kata (kata*)'"
    - expression: "object.spec.?automountServiceAccountToken.orValue(true) == false"
      message: "sandbox pods must not mount a Kubernetes API token"
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) && !object.spec.?hostPID.orValue(false) &&
        !object.spec.?hostIPC.orValue(false)
      message: "sandbox pods must not share host namespaces"
    - expression: >-
        variables.volumes.all(v, !has(v.secret) && !has(v.hostPath) &&
          (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.secret) &&
            (!has(s.serviceAccountToken) || s.serviceAccountToken.?audience.orValue('') == 'kobe.sandbox-bootstrap'))))
      message: "sandbox pods must not mount Secrets, hostPath or API-audience tokens"
    - expression: >-
        variables.containers.all(c,
          (!has(c.envFrom) || c.envFrom.all(e, !has(e.secretRef))) &&
          (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))))
      message: "sandbox pods must not read Secrets into the environment"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $pods }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  policyName: {{ $pods }}
  validationActions: ["Deny"]
  paramRef:
    name: {{ .Values.isolation.runtimeClassName | quote }}
    parameterNotFoundAction: Deny
---
# 3. Sandbox and SandboxTemplate specs in kobe-team-* use the configured RuntimeClass, and
#    templates leave networking to Kobe's default-deny policy (the controller's "Managed" policy
#    would add internet egress).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $specs }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: node.k8s.io/v1
    kind: RuntimeClass
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
      - apiGroups: ["extensions.agents.x-k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxtemplates"]
  matchConditions:
    - name: team-namespace
      expression: {{ $inTeam | quote }}
  validations:
    - expression: "object.spec.podTemplate.spec.?runtimeClassName.orValue('') == params.metadata.name"
      messageExpression: "'sandboxes must use RuntimeClass ' + params.metadata.name"
    - expression: {{ printf "params.handler.matches('%s')" $handler | quote }}
      messageExpression: "'RuntimeClass ' + params.metadata.name + ' does not isolate (handler ' + params.handler + ')'"
    - expression: >-
        request.resource.resource != 'sandboxtemplates' ||
        object.spec.?networkPolicyManagement.orValue('Managed') == 'Unmanaged'
      message: "sandbox templates must not let the controller manage NetworkPolicies"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $specs }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  policyName: {{ $specs }}
  validationActions: ["Deny"]
  paramRef:
    name: {{ .Values.isolation.runtimeClassName | quote }}
    parameterNotFoundAction: Deny
---
# 4. Only the Kobe server creates or changes NetworkPolicies in kobe-team-* (they are additive:
#    anyone else's policy could widen the default deny). Deletes are not matched, so namespace
#    deletion still works; the server has no delete permission on them.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $netpol }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
  matchConditions:
    - name: team-namespace
      expression: {{ $inTeam | quote }}
  validations:
    - expression: {{ printf "request.userInfo.username == '%s'" $serverUser | quote }}
      message: "only the Kobe server manages NetworkPolicies in team namespaces"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $netpol }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  policyName: {{ $netpol }}
  validationActions: ["Deny"]
