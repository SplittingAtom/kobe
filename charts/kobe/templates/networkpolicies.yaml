{{- $fullname := include "kobe.fullname" . -}}
# Components holding secrets or data are reachable only from pods in the release namespace.
# Sandboxes (team namespaces, KOBE-22) are admitted to Bifrost only with sandbox.modelGatewayAccess
# (off until Bifrost verifies their session tokens); their own namespace's policy limits egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-bifrost
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "bifrost") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
    {{- if (include "kobe.sandboxValues" . | fromJson).modelGatewayAccess }}
    # Only once Bifrost verifies sandbox session tokens (sandbox.modelGatewayAccess, KOBE-40/41).
    - from:
        - namespaceSelector:
            matchLabels:
              kobe.splittingatom.io/team-namespace: "true"
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
---
# Sandboxes (team namespaces) must not reach the user-facing web app, the server's user API or the
# scheduler: only the server's sandbox port 8081. The server's internal port 8082 admits only the
# MCP proxy's pods; everything else outside team namespaces gets the app ports (8080, 8081). The team namespace's own egress policy says the
# same; this is the receiving side, so it holds even where a CNI applies egress selectors loosely.
# Everything that is not a team namespace (ingress controller, other Kobe pods, operators) is
# unaffected; traffic from the node itself (kubelet probes) is not subject to NetworkPolicy here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-not-from-sandboxes
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kobe
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["web", "server", "scheduler"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kobe.splittingatom.io/team-namespace
                operator: DoesNotExist
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - from:
        - namespaceSelector:
            matchLabels:
              kobe.splittingatom.io/team-namespace: "true"
      ports:
        - protocol: TCP
          port: 8081
    # The server's internal listener (MCP proxy policy re-check, KOBE-58): the MCP proxy only.
    - from:
        - podSelector:
            matchLabels:
              {{- include "kobe.selectorLabels" (dict "root" . "component" "mcp-proxy") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ include "kobe.serverInternalPort" . }}
{{- if .Values.clamav.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-clamav
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "clamav") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
{{- end }}
{{- if eq .Values.postgres.mode "cnpg" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-pg
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $fullname }}-pg
  policyTypes: ["Ingress"]
  ingress:
    # Kobe workloads and the Postgres instances themselves (replication).
    - from:
        - podSelector: {}
    # The CloudNativePG operator manages instances over the status and Postgres ports.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.postgres.cnpg.operatorNamespace }}
{{- end }}
