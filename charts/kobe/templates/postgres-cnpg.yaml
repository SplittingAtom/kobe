{{- if eq .Values.postgres.mode "cnpg" -}}
{{- $fullname := include "kobe.fullname" . -}}
{{- $secretName := printf "%s-db-app" $fullname -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if $existing -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
# Login for the non-owner app role; kept stable across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: kobe_app
  password: {{ $password | quote }}
---
# Bundled CloudNativePG Cluster (requires the CloudNativePG operator). The database owner runs
# migrations; the app connects as kobe_app, which is not superuser, cannot bypass RLS and owns
# nothing (enforced again by the migration runner).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $fullname }}-pg
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.cnpg.instances }}
  imageName: {{ .Values.postgres.cnpg.imageName }}
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  storage:
    size: {{ .Values.postgres.cnpg.storage.size }}
    {{- with .Values.postgres.cnpg.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: kobe
      owner: kobe_owner
  managed:
    roles:
      - name: kobe_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        inherit: true
        inRoles: []
        passwordSecret:
          name: {{ $secretName }}
{{- end }}
