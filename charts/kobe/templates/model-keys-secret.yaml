{{- $b := include "kobe.bifrostValues" . | fromJson -}}
{{- if not $b.keysSecret -}}
{{- include "kobe.requireOnlineToGenerate" (dict "root" . "what" "the model gateway secrets" "value" "bifrost.keysSecret") -}}
{{- $name := include "kobe.modelKeysSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := ($existing).data | default dict -}}
# Model gateway secrets (KOBE-40), generated once and kept. Who gets which:
#   bifrost-admin-password  Bifrost (its admin API) and the server (which reconciles Bifrost)
#   bifrost-encryption-key  Bifrost only (seals provider keys in its own store)
#   provider-keys           the server only (seals provider API keys in Postgres)
#   virtual-keys            the server and the model-gateway shim (members' Bifrost virtual keys)
# Sandboxes get none of them. Changing encryption-key needs a fresh Bifrost store (it is rebuilt by
# the sync); changing provider-keys means re-entering provider keys.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range include "kobe.modelKeyNames" . | fromJsonArray }}
  {{ . }}: {{ ternary (index $data . | default "" | b64dec) (randAlphaNum 48) (hasKey $data .) | quote }}
  {{- end }}
{{- end }}
