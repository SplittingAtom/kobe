{{- $fullname := include "kobe.fullname" . -}}
{{- $g := include "kobe.modelGatewayValues" . | fromJson -}}
# Model gateway shim (KOBE-40). Ingress: only sandboxes (team namespaces), only the shim's port; the
# team namespace's own policy says the same from the sending side, this is the receiving side that
# holds regardless of how the CNI applies egress selectors (KOBE-22 kube-router finding).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-model-gateway
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kobe.selectorLabels" (dict "root" . "component" "model-gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $g.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kobe.splittingatom.io/team-namespace: "true"
      ports:
        - protocol: TCP
          port: 8080
  {{- if $g.networkPolicy.restrictEgress }}
  # The shim's own egress: DNS, Bifrost, Postgres. Nothing else (it never talks to providers).
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "kobe.selectorLabels" (dict "root" . "component" "bifrost") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- if eq .Values.postgres.mode "cnpg" }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $fullname }}-pg
      ports:
        - protocol: TCP
          port: 5432
    {{- else if $g.networkPolicy.databasePeers }}
    - to:
        {{- toYaml $g.networkPolicy.databasePeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ int $g.networkPolicy.databasePort }}
    {{- else }}
    # External Postgres without modelGateway.networkPolicy.databasePeers: any address, Postgres
    # port only. Set databasePeers to narrow this to your database.
    - ports:
        - protocol: TCP
          port: {{ int $g.networkPolicy.databasePort }}
    {{- end }}
  {{- end }}
