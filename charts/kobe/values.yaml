# Kobe Helm values. Every key is validated by values.schema.json (unknown keys are rejected).

global:
  # Registry for Kobe images; images are private, so set imagePullSecrets (applied to every pod).
  imageRegistry: ghcr.io/splittingatom
  # Defaults to the chart appVersion.
  imageTag: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Generated secrets (auth, bundled-Postgres password) are kept by looking up the existing Secret.
  # Offline renders (helm template, GitOps) can't, so they fail unless you pass existingSecrets.
  # true only for throwaway environments (dev loop, CI).
  allowGeneratedSecretsOffline: false

# Kobe refuses to run agents without a gVisor or Kata RuntimeClass (spec D4). The install fails
# when none exists; there is no switch to disable this check.
isolation:
  # RuntimeClass sandboxes run under; its handler must be runsc (gVisor) or kata*.
  runtimeClassName: gvisor

# Sandboxes (spec D11, D12): one per (user, team), in namespace kobe-team-<slug>, run by the
# agent-sandbox controller under isolation.runtimeClassName. The server creates and manages the
# team namespaces (default-deny NetworkPolicy, ResourceQuota, warm pool); see docs/install.md.
sandbox:
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
  # Container ephemeral storage (writable layer, logs, the /tmp and $HOME emptyDirs).
  ephemeralStorage: { request: 1Gi, limit: 4Gi }
  # Let sandboxes reach the model gateway (Bifrost). Off until the gateway verifies sandbox
  # session tokens (KOBE-40/41); until then any agent could spend model credit through it.
  modelGatewayAccess: false
  workspace:
    # Persistent /workspace per sandbox.
    size: 10Gi
    # "" uses the cluster default (k3s: local-path, which pins a sandbox to its node; use
    # Longhorn on multi-node clusters).
    storageClass: ""
  # /tmp and $HOME are emptyDirs, wiped on hibernate.
  tmpSize: 2Gi
  homeSize: 1Gi
  # ResourceQuota of every team namespace (sandbox compute is capped here, not in dollars).
  # Limits are capped too, so a team's sandboxes cannot burst into other teams' memory.
  teamQuota:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    requests.ephemeral-storage: 40Gi
    limits.ephemeral-storage: 160Gi
    requests.storage: 500Gi
    persistentvolumeclaims: "50"
    pods: "50"
  warmPool:
    # Pre-started sandboxes per team namespace (agent-sandbox warm pools are namespaced). Each
    # one counts against its team's quota. 0 disables warm starts.
    replicasPerTeam: 1
  # Secret with keys sandbox-wire, model-gateway, mcp-proxy, egress-proxy (>= 32 chars each, all
  # different): HMAC keys of the per-audience sandbox session tokens. Empty: generated, kept.
  sessionKeysSecret: ""

# Public origin users reach Kobe at (cookies, WebAuthn relying party). Defaults to
# http(s)://<ingress.host>; set it when Kobe sits behind another proxy or ingress is disabled.
publicUrl: ""

auth:
  # Secret with keys "secret" (>= 32 chars) and "setup-token" (>= 24 chars). Empty: generated, kept.
  existingSecret: ""
  # Proxies whose X-Forwarded-For is trusted for client IPs (rate limits): Traefik runs in the k3s
  # pod network. Add your load balancer's CIDR if one sits in front.
  trustedProxies:
    - 10.42.0.0/16

# Outgoing email (spec D7: required): invitations, password resets, notifications. API server only.
smtp:
  # SMTP relay host (required), e.g. smtp.example.com.
  host: ""
  port: 587
  # starttls: STARTTLS required (587); tls: implicit TLS (465); none: unencrypted, for an in-cluster
  # dev relay only, and never with credentials. Certificates are always verified.
  security: starttls
  # Sender (required): "Kobe <kobe@example.com>" or an address.
  from: ""
  # Secret with keys "username" and "password" for SMTP AUTH. Empty: no authentication.
  existingSecret: ""

web:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

server:
  # Stateless; at least two replicas from day one (spec D2).
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }

scheduler:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

mcpProxy:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

egressProxy:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# Model gateway, always installed (spec D30). Provider keys live here, never in sandboxes.
bifrost:
  image:
    repository: docker.io/maximhq/bifrost
    tag: v2.2.4
  replicas: 1
  persistence:
    # Without persistence Bifrost's config lives in an emptyDir and is rebuilt by config sync.
    enabled: false
    size: 1Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

postgres:
  # external: bring your own Postgres 17 (+pg_trgm). cnpg: bundle a CloudNativePG Cluster (the
  # CloudNativePG operator must already be installed).
  mode: external
  external:
    # Secret with an app-role connection URL (non-owner role) and an owner URL for migrations.
    existingSecret: ""
    appUrlKey: app-url
    migrateUrlKey: migrate-url
    # Login role in app-url; the migration runner grants it privileges and refuses unsafe roles.
    appRole: kobe_app
  cnpg:
    instances: 1
    # Namespace of the CloudNativePG operator (allowed through the Postgres NetworkPolicy).
    operatorNamespace: cnpg-system
    # Pre-created kubernetes.io/basic-auth Secret for kobe_app (username kobe_app, password).
    # Required for GitOps/offline renders; otherwise the chart generates and keeps one.
    existingAppSecret: ""
    imageName: ghcr.io/cloudnative-pg/postgresql:17
    storage:
      size: 10Gi
      storageClass: ""

# External S3-compatible object storage (no bundled S3).
s3:
  endpoint: ""
  region: us-east-1
  bucket: ""
  forcePathStyle: true
  # Secret with keys access-key-id and secret-access-key.
  existingSecret: ""

ingress:
  enabled: true
  className: traefik
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""
    # cert-manager ClusterIssuer; leave empty to manage the TLS Secret yourself.
    clusterIssuer: ""

# Optional upload scanning (spec D26), off by default.
clamav:
  enabled: false
  image:
    repository: docker.io/clamav/clamav
    tag: "1.4"
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
