# Kobe Helm values. Every key is validated by values.schema.json (unknown keys are rejected).

global:
  # Registry for Kobe images; images are private, so set imagePullSecrets (applied to every pod).
  imageRegistry: ghcr.io/splittingatom
  # Defaults to the chart appVersion.
  imageTag: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Generated secrets (auth, bundled-Postgres password) are kept by looking up the existing Secret.
  # Offline renders (helm template, GitOps) can't, so they fail unless you pass existingSecrets.
  # true only for throwaway environments (dev loop, CI).
  allowGeneratedSecretsOffline: false

# Kobe refuses to run agents without a gVisor or Kata RuntimeClass (spec D4). The install fails
# when none exists; there is no switch to disable this check.
isolation:
  # RuntimeClass sandboxes run under; its handler must be runsc (gVisor) or kata*.
  runtimeClassName: gvisor

# Sandboxes (spec D11, D12): one per (user, team), in namespace kobe-team-<slug>, run by the
# agent-sandbox controller under isolation.runtimeClassName. The server creates and manages the
# team namespaces (default-deny NetworkPolicy, ResourceQuota, warm pool); see docs/install.md.
sandbox:
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
  # Container ephemeral storage (writable layer, logs, the /tmp and $HOME emptyDirs).
  ephemeralStorage: { request: 1Gi, limit: 4Gi }
  # Let sandboxes reach models through the model-gateway shim (KOBE-40), which verifies their
  # session tokens and forwards inference only. false cuts sandboxes off from every model.
  modelGatewayAccess: true
  workspace:
    # Persistent /workspace per sandbox.
    size: 10Gi
    # "" uses the cluster default (k3s: local-path, which pins a sandbox to its node; use
    # Longhorn on multi-node clusters).
    storageClass: ""
    # Longhorn only: create a StorageClass with one replica on the sandbox's own node
    # (dataLocality strict-local) and use it for workspaces. Wakes attach a local replica (faster
    # cold start); a lost node loses its sandboxes' volumes, which are restored from the S3
    # workspace sync (docs/install.md). Leave storageClass empty when enabling this.
    longhornStrictLocal:
      enabled: false
  # /tmp and $HOME are emptyDirs, wiped on hibernate.
  tmpSize: 2Gi
  homeSize: 1Gi
  # ResourceQuota of every team namespace (sandbox compute is capped here, not in dollars).
  # Limits are capped too, so a team's sandboxes cannot burst into other teams' memory.
  teamQuota:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    requests.ephemeral-storage: 40Gi
    limits.ephemeral-storage: 160Gi
    requests.storage: 500Gi
    persistentvolumeclaims: "50"
    pods: "50"
  warmPool:
    # Pre-started sandboxes per team namespace (agent-sandbox warm pools are namespaced). Each
    # one counts against its team's quota. 0 disables warm starts.
    replicasPerTeam: 1
  # Spec D14: an awake sandbox hibernates (pod stopped, /workspace kept, /tmp wiped) this many
  # minutes after its last activity; teams may choose 5-60 (team setting sandbox_idle_minutes).
  # Waking costs a cold pod start (the warm pool only serves first sandboxes).
  hibernation:
    enabled: true
    idleMinutes: 15
    # How often each server replica looks for idle sandboxes.
    sweepSeconds: 60
  # Durable copy of every sandbox's /workspace in object storage (s3.*), so losing or rebuilding a
  # volume loses no files (KOBE-27). The server brokers every transfer on its sandbox port:
  # sandboxes hold no storage credentials and gain no network access. Off without s3.bucket.
  workspaceSync:
    enabled: true
    # Sandboxes push changes this often (also after every run and before hibernating).
    pushIntervalSeconds: 60
    # Larger files are not synced (they stay on the volume only).
    maxFileSize: 1Gi
    # Per workspace; empty = the /workspace volume size. Teams' storage quota (D26) comes later.
    maxWorkspaceSize: ""
    maxFiles: 100000
    # How often each server replica collects unreferenced content and old deletion markers.
    collectSeconds: 3600
  # Pre-publish Orbit evals (KOBE-93): when a team turns the gate on, Publish runs the kobe-orbit-eval
  # image as a Job in the team namespace, under the same isolation as sandboxes (gVisor/Kata, no
  # service account token, a NetworkPolicy that reaches only the model gateway).
  orbitEval:
    # activeDeadlineSeconds of the Job; an eval that runs longer is errored and publish stays blocked.
    deadlineSeconds: 900
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 2Gi }
  # Secret with keys sandbox-wire, model-gateway, mcp-proxy, egress-proxy (>= 32 chars each, all
  # different): HMAC keys of the per-audience sandbox session tokens. Empty: generated, kept.
  # Also approval-hmac (>= 32 chars): signs tool-call approvals (KOBE-37); without it every call
  # that needs approval is denied.
  sessionKeysSecret: ""

# Rancher-managed clusters: grant the server's ServiceAccount `updatepsa` on Rancher projects, which
# Rancher's namespace webhook requires to create the (Pod Security labelled) team namespaces.
rancher:
  enabled: false

# Public origin users reach Kobe at (cookies, WebAuthn relying party). Defaults to
# http(s)://<ingress.host>; set it when Kobe sits behind another proxy or ingress is disabled.
publicUrl: ""

auth:
  # Secret with keys "secret" (>= 32 chars) and "setup-token" (>= 24 chars). Empty: generated, kept.
  existingSecret: ""
  # Proxies whose X-Forwarded-For is trusted for client IPs (rate limits): Traefik runs in the k3s
  # pod network. Add your load balancer's CIDR if one sits in front.
  trustedProxies:
    - 10.42.0.0/16

# Outgoing email (spec D7: required): invitations, password resets, notifications. API server only.
smtp:
  # SMTP relay host (required), e.g. smtp.example.com.
  host: ""
  port: 587
  # starttls: STARTTLS required (587); tls: implicit TLS (465); none: unencrypted, for an in-cluster
  # dev relay only, and never with credentials. Certificates are always verified.
  security: starttls
  # Sender (required): "Kobe <kobe@example.com>" or an address.
  from: ""
  # Secret with keys "username" and "password" for SMTP AUTH. Empty: no authentication.
  existingSecret: ""

web:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

server:
  # Stateless; at least two replicas from day one (spec D2).
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }

scheduler:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# MCP proxy (spec D27): sandboxes reach remote MCP servers (Streamable HTTP) only through it. The
# server decides every call (policy re-check, signed approvals, audit) on its internal port 8082.
mcpProxy:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # Plain-http connector URLs. Development and CI only: user credentials would travel unencrypted.
  allowInsecureHttp: false
  # Upstream ports connectors may use.
  allowedPorts: [443]
  # Internal targets (CIDRs) connectors may resolve to, e.g. an on-premises MCP server. Private,
  # loopback, link-local (cloud metadata) and reserved addresses are refused unless listed here.
  allowedInternalCidrs: []
  # More ranges to refuse (your cluster's pod/Service CIDRs if they are not private addresses).
  deniedCidrs: []
  # Secret with key "key" (>= 32 chars) the proxy presents to the server. Empty: generated, kept.
  internalKeySecret: ""
  limits:
    # Largest request from a sandbox and largest upstream answer.
    maxRequestBytes: 1048576
    maxResponseBytes: 4194304
    # A whole upstream call; stays under Pi's 60 s MCP request timeout.
    upstreamTimeoutSeconds: 55
    # Concurrent calls per sandbox and per proxy replica.
    callsPerSandbox: 8
    concurrentCalls: 256
    # Requests per sandbox: a burst, then this many per second (per replica).
    requestBurst: 60
    requestsPerSecond: 10
  networkPolicy:
    # Restrict the proxy's own egress to DNS, the server's internal port and public addresses on
    # allowedPorts (plus allowedInternalCidrs).
    restrictEgress: true
    # Extra raw NetworkPolicy egress rules for the proxy.
    extraEgress: []

# Envelope encryption (KOBE-107): the install key-encryption key for per-record secrets such as
# connector credentials. Existing Secret (key `key`, optional `key-previous`), or empty to generate
# one and keep it across upgrades. Only the API server gets it; mcp-proxy never decrypts.
envelope:
  keySecret: ""

# Default-deny egress proxy (spec D28): sandboxes reach the internet only through it, HTTPS only,
# to domains their team enabled within the install's egress ceiling (admin consoles).
egressProxy:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  # Destination ports sandboxes may CONNECT to.
  allowedPorts: [443]
  # Internal targets sandboxes may reach (CIDRs), still only for allowlisted domains. Everything
  # private, loopback, link-local (cloud metadata) and reserved is refused unless listed here.
  allowedInternalCidrs: []
  # More ranges to refuse: your cluster's pod/Service CIDRs if they are not private addresses.
  # IPv4 entries are also excluded from the proxy's own NetworkPolicy.
  deniedCidrs: []
  # Connections are written to the audit log aggregated per user, host and outcome over this window.
  auditFlushSeconds: 60
  # Header injection (KOBE-39): an existing Secret (key `secret`, optional `secret-previous`) that
  # seals the headers team admins inject for egress domains. Empty: generated and kept.
  headerSecret: ""
  # Plain-HTTP requests to header-injected domains, upgraded to verified HTTPS by the proxy.
  upgrade:
    maxRequestBytes: 104857600
    maxResponseBytes: 2147483648
    timeoutSeconds: 600
  limits:
    # Concurrent tunnels per sandbox and in total (per proxy replica).
    connectionsPerSandbox: 64
    connections: 4096
    # Per sandbox, both directions together; 0 disables.
    bandwidthBytesPerSecond: 20971520
    idleTimeoutSeconds: 300
    # Tunnels close after this long, and when the session token that opened them expires (15 min).
    maxTunnelSeconds: 3600
    # Sockets that have not authenticated yet (5 s to send the request head): per source address
    # (one sandbox pod) and in total, separate from the tunnel limit above.
    unauthenticatedPerSource: 16
    unauthenticated: 1024
  networkPolicy:
    # Restrict the proxy's own egress to DNS, Postgres and public addresses on allowedPorts.
    restrictEgress: true
    # External Postgres only: NetworkPolicy peers (ipBlock / namespaceSelector) of your database.
    # Empty: the proxy may reach any address on databasePort.
    databasePeers: []
    databasePort: 5432
    # Extra raw NetworkPolicy egress rules for the proxy.
    extraEgress: []

# Model gateway shim (spec D30, KOBE-40): the only way sandboxes reach a model. It verifies their
# model-gateway session token, checks the member and sandbox are still live, and forwards inference
# (only) to Bifrost with the member's virtual key. Holds no provider key.
modelGateway:
  # Two replicas: one shim restarting or busy does not cut every team off from models.
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    # Must cover limits.inflightBytes + 256Mi (checked at render time).
    limits: { cpu: "1", memory: 512Mi }
  limits:
    # Request bodies (prompts, images) up to this size.
    maxBodyBytes: 8388608
    # Request bytes held in memory at once, per replica and per sandbox (beyond them: 429).
    inflightBytes: 134217728
    inflightBytesPerSandbox: 33554432
    # Concurrent model calls per sandbox and in total (per replica); beyond them: 429.
    callsPerSandbox: 16
    calls: 1024
    # Requests per sandbox: a burst, then this many per second (per replica); beyond them: 429.
    requestBurst: 60
    requestsPerSecond: 10
    # A call that moves no bytes either way for this long is cut.
    idleTimeoutSeconds: 300
  # Membership, sandbox liveness and virtual keys are cached this long: a removed member, a
  # deactivated user or a destroyed sandbox loses model access within it.
  cacheTtlSeconds: 5
  networkPolicy:
    # Restrict the shim's own egress to DNS, Bifrost and Postgres.
    restrictEgress: true
    # External Postgres only: NetworkPolicy peers of your database (as for egressProxy).
    databasePeers: []
    databasePort: 5432

# Model gateway (spec D4, D30), always installed: Bifrost (Apache-2.0) holds the provider keys and
# enforces each member's model allowlist. Kobe is the source of truth (install admin console and
# API): the server pushes providers, keys, catalog models and the customer/team/virtual-key
# hierarchy to it. Only the shim and the server can reach it.
bifrost:
  image:
    repository: docker.io/maximhq/bifrost
    tag: v2.2.5
    # Multi-arch index digest of the tag (pinned; update both together).
    digest: sha256:65854fd1941ba8159f1f98cd69df380f6e8ac8cd374bde632c4e28f822a6f115
  # Exactly one: Bifrost keeps virtual keys (and, with budgets, spend counters) in its own store.
  replicas: 1
  persistence:
    # Keeps Bifrost's store across restarts (virtual keys, budget counters). Without it the sync
    # rebuilds everything after a restart, with new virtual keys and budget counters reset.
    enabled: true
    size: 1Gi
    storageClass: ""
  # Secret with keys bifrost-admin-password, bifrost-encryption-key, provider-keys, virtual-keys
  # (>= 32 chars each, all different), optionally provider-keys-previous / virtual-keys-previous
  # during a rotation. Empty: generated, kept.
  keysSecret: ""
  # Test installs only (e2e with a fake provider): lets OpenAI/Anthropic/Gemini providers take a
  # base_url and keyed providers a plain-http endpoint. Off: a provider key only ever goes to its
  # vendor, or over https to the endpoint it was entered with.
  allowUnsafeProviderEndpoints: false
  networkPolicy:
    # Restrict Bifrost's egress to DNS and public addresses on allowedPorts (model providers).
    restrictEgress: true
    allowedPorts: [443]
    # Local model servers (Ollama, vLLM) on private addresses: raw NetworkPolicy egress rules, e.g.
    # [{to: [{ipBlock: {cidr: 10.20.30.40/32}}], ports: [{protocol: TCP, port: 11434}]}].
    extraEgress: []
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

postgres:
  # external: bring your own Postgres 17 (+pg_trgm). cnpg: bundle a CloudNativePG Cluster (the
  # CloudNativePG operator must already be installed).
  mode: external
  external:
    # Secret with an app-role connection URL (non-owner role) and an owner URL for migrations.
    existingSecret: ""
    appUrlKey: app-url
    migrateUrlKey: migrate-url
    # Login role in app-url; the migration runner grants it privileges and refuses unsafe roles.
    appRole: kobe_app
  cnpg:
    instances: 1
    # Namespace of the CloudNativePG operator (allowed through the Postgres NetworkPolicy).
    operatorNamespace: cnpg-system
    # Pre-created kubernetes.io/basic-auth Secret for kobe_app (username kobe_app, password).
    # Required for GitOps/offline renders; otherwise the chart generates and keeps one.
    existingAppSecret: ""
    imageName: ghcr.io/cloudnative-pg/postgresql:17
    storage:
      size: 10Gi
      storageClass: ""

# External S3-compatible object storage (no bundled S3).
s3:
  endpoint: ""
  region: us-east-1
  bucket: ""
  forcePathStyle: true
  # Secret with keys access-key-id and secret-access-key.
  existingSecret: ""

ingress:
  enabled: true
  className: traefik
  host: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""
    # cert-manager ClusterIssuer; leave empty to manage the TLS Secret yourself.
    clusterIssuer: ""

# Optional upload scanning (spec D26), off by default.
clamav:
  enabled: false
  image:
    repository: docker.io/clamav/clamav
    tag: "1.4"
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
