packages:
  - apps/*
  - services/*
  - packages/*
  - tools/*
  - charts/*
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.6"
  - "@turbo/darwin-arm64@2.11.6"
  - "@turbo/linux-64@2.11.6"
  - "@turbo/linux-arm64@2.11.6"
  - "@turbo/windows-64@2.11.6"
  - "@turbo/windows-arm64@2.11.6"
  - globals@17.13.0
  - turbo@2.11.6

# sharp ships LGPL libvips binaries (license policy, spec D3). Kobe serves images unoptimized.
ignoredOptionalDependencies:
  - sharp

# Dependency lifecycle scripts are denied unless listed here (supply-chain policy). esbuild (via
# drizzle-kit and vite) works without its postinstall: it resolves its @esbuild/<platform> binary.
allowBuilds:
  esbuild: false
  # protobufjs (via the OTLP exporter) only runs a postinstall version-scheme check; not needed.
  protobufjs: false

# @kubernetes/client-node 2.0.x accepts undici ^8.7.0 and would keep 8.11.2, which has fixable HIGH
# CVEs (Trivy, KOBE-539); 8.12.2 fixes them. Drop this once its range starts at 8.12.2.
overrides:
  undici@<8.12.2: ">=8.12.2 <9"
