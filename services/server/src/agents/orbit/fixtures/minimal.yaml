name: kobe-sales-analyst-v1
setup:
  agents:
    - name: sales-analyst
      role: assistant
      system_prompt: You are a careful analyst.
      tools:
        - bash
        - codemode
        - create_artifact
        - edit
        - find
        - grep
        - ls
        - open_file
        - powershell
        - propose_file_edit
        - propose_project_file
        - read
        - recall
        - remember
        - run_python
        - save_skill_draft
        - share_file
        - tool_search
        - update_artifact
        - web_search
        - write
  edges: []
metadata:
  kobe:
    agent_version: 1
    approval_mode: ask-on-write
    connectors: []
    manifest_format: 1
